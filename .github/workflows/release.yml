# Build + publish the OllyStack managed collector image — the curated OCB distribution (only the
# components the portal offers, not all of contrib): the opt-in HARDENED tier, smaller attack surface.
#
# This repo is the PUBLIC build home, so the workflow pushes to ghcr.io/ollystack/otelcol with
# its OWN GITHUB_TOKEN (same org — no cross-org PAT) and runs on free public-repo Actions minutes.
# The manifest (manifest.yaml + versions/<ver>/manifest.yaml) is vendored from the private catalog on
# each collector bump; it's just upstream OTel gomod paths (no secrets).
#
# Per-version: the OCB manifest is version-locked, so `version` (re)builds a snapshotted version from
# versions/<ver>/manifest.yaml; empty builds the current root manifest.yaml.
#
# SPEED: each arch builds on its NATIVE runner (amd64 on x64, arm64 on ubuntu-24.04-arm) — NO QEMU.
# Emulating an arm64 compile of the 54-component collector took ~1h+; native arm64 is minutes. The two
# per-arch images push BY DIGEST (no tag); the `merge` job assembles the multi-arch tag and does the
# single sign/attest/SBOM on the published image (the free arm64 runners are GA for public repos).
#
# Hardening: pinned actions, least-privilege token, hardened runner, a BLOCKING govulncheck on the
# built binary (per arch), and a signed (cosign) + attested (SLSA) + SBOM'd multi-arch image.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional: a snapshotted version to (re)build (e.g. 0.154.0). Empty = current manifest.yaml."
        required: false
        default: ""
  push:
    branches: [main]
    # ONLY things that change what the CURRENT image contains. An automatic push build always builds
    # the ROOT manifest.yaml, so any path here that isn't the current image's content re-publishes the
    # current tag with a new digest — silently invalidating the digest the private catalog pins for it
    # (catalog/distros.yaml `digests:`), which is the pin bundles render as `image@sha256:...`.
    #
    # Deliberately NOT triggers:
    #   versions/**   — a historical snapshot. Vendoring versions/0.156.0/manifest.yaml rebuilt and
    #                   re-pushed 0.157.0, which is how this was found. Those exist to be built on
    #                   demand: `gh workflow run release.yml -f version=0.156.0`.
    #   this workflow — a CI edit is not an image-content change. If one warrants a rebuild, dispatch
    #                   it; that keeps every workflow tweak from minting a new digest for a shipped
    #                   tag (and from needing [skip ci] to avoid it).
    paths:
      - "manifest.yaml"
      - "Dockerfile"

permissions: {}

env:
  IMAGE: ghcr.io/ollystack/otelcol

jobs:
  # Per-arch build on a NATIVE runner — no QEMU. Each leg builds + govulncheck-gates its own arch's
  # binary, then pushes the single-arch image BY DIGEST (no tag). `merge` stitches the tag together.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write       # push the image to ghcr.io/ollystack (same org, via GITHUB_TOKEN)
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"   # filterprocessor linker bug (needs 1.26+) + GO-2026-5856
          check-latest: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve the manifest + version
        id: v
        run: |
          VIN="${{ github.event.inputs.version }}"
          if [ -n "$VIN" ]; then
            SNAP="versions/${VIN}/manifest.yaml"
            if [ ! -f "$SNAP" ]; then
              echo "::error::no manifest snapshot for ${VIN} ($SNAP). Vendor it (versions/${VIN}/manifest.yaml) from the private repo first."
              exit 1
            fi
            cp "$SNAP" manifest.yaml
            echo "building snapshotted version ${VIN}"
          fi
          VER="$(grep -m1 'otelcol_version:' manifest.yaml | awk '{print $2}' | tr -d '\"')"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "managed-otelcol v${VER} (${{ matrix.platform }})"

      # Republishing a tag is legitimate (a Dockerfile/dependency security rebuild) but must never be
      # a surprise: the new digest invalidates the pin the private catalog records for that version,
      # and its managed-image-sync will (correctly) refuse to auto-update and raise a conflict for a
      # human. Surface it here, at the source, rather than letting it turn up downstream. Warn, don't
      # block — an intentional rebuild is a real use case.
      - name: Note if this republishes an existing tag
        run: |
          VER="${{ steps.v.outputs.version }}"
          TOK=$(curl -sf "https://ghcr.io/token?scope=repository:ollystack/otelcol:pull&service=ghcr.io" | jq -r .token || true)
          DIG=$(curl -sfI -H "Authorization: Bearer $TOK" \
                  -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
                  "https://ghcr.io/v2/ollystack/otelcol/manifests/${VER}" 2>/dev/null \
                | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          if [ -n "$DIG" ]; then
            echo "::warning::${VER} is already published as ${DIG}. This run REPLACES that tag with a new digest — the private catalog's recorded pin for ${VER} will no longer match and its managed-image-sync will flag a conflict for review."
          else
            echo "${VER} is not yet published — this is a first publish."
          fi

      - name: No floating gomod versions
        run: |
          if grep -Eq 'gomod:.*(latest|master|main)$' manifest.yaml; then
            echo "::error::floating gomod version in manifest.yaml"; exit 1
          fi

      - name: Build the managed collector (OCB) — the govulncheck subject (native ${{ matrix.arch }})
        env:
          CGO_ENABLED: "0"
        run: |
          VER="${{ steps.v.outputs.version }}"
          go install "go.opentelemetry.io/collector/cmd/builder@v${VER}"
          "$(go env GOPATH)/bin/builder" --config manifest.yaml
          test -x _build/managed-otelcol

      - name: Vulnerability scan (govulncheck, binary mode — blocking, gates the image)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Accepted (no-fix, assessed-not-exploitable) — all deprecated/unsafe-by-design crypto
          # packages linked transitively, NOT on the collector's telemetry path; "Fixed in: N/A".
          # Binary mode flags the LINKED symbol, not an actual call path. Review each on every bump;
          # any OTHER finding (incl. a fixable one) still fails the gate.
          #   GO-2022-0635 / GO-2022-0646 — aws-sdk-go v1 s3crypto (S3 client-side encryption; AWS
          #                                 deprecated the client instead of patching v1).
          #   GO-2026-5932              — golang.org/x/crypto/openpgp (upstream-deprecated, unmaintained).
          ALLOW="GO-2022-0635 GO-2022-0646 GO-2026-5932"
          set +e
          OUT="$("$(go env GOPATH)/bin/govulncheck" -mode=binary _build/managed-otelcol 2>&1)"; rc=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$rc" -eq 0 ]; then echo "govulncheck: clean"; exit 0; fi
          # govulncheck exits 3 when vulnerabilities are found; any OTHER non-zero is a tool/error, fail hard.
          if [ "$rc" -ne 3 ]; then echo "::error::govulncheck errored (exit $rc), not a vuln result"; exit 1; fi
          BAD=""
          for id in $(printf '%s\n' "$OUT" | grep -oE 'GO-[0-9]{4}-[0-9]+' | sort -u); do
            case " $ALLOW " in *" $id "*) : ;; *) BAD="$BAD $id" ;; esac
          done
          if [ -n "$BAD" ]; then echo "::error::non-allowlisted vulnerabilities:$BAD"; exit 1; fi
          echo "govulncheck: only allowlisted (accepted, no-fix) findings present — OK"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}   # same-org packages:write — no PAT

      - name: Build + push by digest (${{ matrix.platform }}, native — no QEMU)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            OTELCOL_VERSION=${{ steps.v.outputs.version }}
          # Push the single-arch image by digest only (no tag) — the merge job creates the tag.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${d#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the multi-arch tag from the two per-arch digests, then sign / attest / SBOM the ONE
  # published multi-arch image and print the digest to record in the private repo's `managed` distro.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # create the multi-arch tag
      id-token: write       # keyless cosign + SLSA provenance (Sigstore OIDC)
      attestations: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create the multi-arch manifest + capture the index digest
        id: merge
        run: |
          VER="${{ needs.build.outputs.version }}"
          cd /tmp/digests
          # Each file is named for its per-arch digest (sha256 hex, no prefix); stitch them into the tag.
          srcs=()
          for f in *; do srcs+=("${IMAGE}@sha256:${f}"); done
          docker buildx imagetools create -t "${IMAGE}:${VER}" "${srcs[@]}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VER}" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}:${VER} @ ${DIGEST}"

      - name: SLSA build-provenance for the image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Keyless-sign the image (Sigstore)
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${IMAGE}@${{ steps.merge.outputs.digest }}"

      - name: SBOM (SPDX) for the image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.merge.outputs.version }}
          format: spdx-json
          output-file: managed-otelcol-${{ steps.merge.outputs.version }}.sbom.spdx.json
          upload-artifact: true

      - name: Record — version + digest for the private repo's `managed` distro
        run: |
          VER="${{ steps.merge.outputs.version }}"; D="${{ steps.merge.outputs.digest }}"
          {
            echo "## Published \`${IMAGE}:${VER}\`"
            echo ""
            echo "\`${IMAGE}:${VER}\` @ \`${D}\`  (signed + SLSA-attested + SBOM)"
            echo ""
            echo "In the PRIVATE repo's \`catalog/distros.yaml\` (\`managed\` distro):"
            echo '```yaml'
            echo "    versions: [ …, \"${VER}\" ]"
            echo "    digests:"
            echo "      \"${VER}\": ${D}"
            echo '```'
            echo ""
            echo "First publish only: make the ghcr package PUBLIC (unauthenticated pull)."
          } >> "$GITHUB_STEP_SUMMARY"
